<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>CATEGORIAS</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">CATEGORIAS</ion-title>
    </ion-toolbar>
  </ion-header>
  @if (enableEdit) {
  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button (click)="navigateToCategoryCreation()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
  }

  <ion-col>
    @for (item of categoriesShown; track item.id) {
    <ion-card>
      <ion-row style="display: flex">
        <ion-item [style.--category-color]="item.color">
          <ion-icon class="avatar" slot="start" [name]="item.icon" [color]="item.color"></ion-icon>
          <ion-label class="category-name">{{ item.name }}</ion-label>
          @if (enableEdit) {

          <ion-button
            size="default"
            slot="end"
            color="secondary"
            fill="clear"
            (click)="navigateToCategoryCreation(item.id)"
          >
            <ion-icon slot="icon-only" name="pencil"></ion-icon>
          </ion-button>
          <ion-button
            size="default"
            slot="end"
            color="danger"
            fill="clear"
            (click)="showDeleteConfirmation(item)"
          >
            <ion-icon slot="icon-only" name="trash"></ion-icon>
          </ion-button>
          }
        </ion-item>
      </ion-row>
    </ion-card>
    }@empty {

    <app-empty-state
      text="No hay categorias para mostrar, agrega una nueva categoria."
    ></app-empty-state>
    }
  </ion-col>
  <ion-infinite-scroll (ionInfinite)="onIonInfinite($event)">
    <ion-infinite-scroll-content></ion-infinite-scroll-content>
  </ion-infinite-scroll>
</ion-content>
